version: "2"

run:
  timeout: 5m
  tests: true

formatters:
  enable:
  - goimports

linters:
  enable:
  - errcheck
  - govet
  - ineffassign
  - unused
  - bodyclose
  - gocritic
  - misspell
  - unconvert
  - staticcheck
  - depguard
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: "github.com/gogo/status"
            - pkg: "github.com/gogo/codes"
            - pkg: "github.com/gogo/protobuf"
    misspell:
      locale: US
  exclusions:
    # Restore v1 default exclusions removed in v2.
    # std-error-handling suppresses errcheck on deferred Close, print functions, etc.
    presets:
    - std-error-handling
    rules:
    - linters:
      - gocritic
      text: ifElseChain
    # Suppress staticcheck quickfix (QF) suggestions — pre-existing style issues,
    # not introduced by this Go version bump.
    - linters:
      - staticcheck
      text: "^QF"
    - path: _test\.go
      linters:
      - bodyclose
    - path: config/with\.go
      linters:
      - ineffassign
      - staticcheck
    - linters:
      - staticcheck
      text: "SA1019: package github.com/golang/protobuf"
